name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: tests · types · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Tests
        run: uv run python -m pytest -q
      - name: Types (mypy)
        run: uv run python -m mypy
      - name: Lint (ruff)
        run: uv run python -m ruff check
      - name: Format (ruff)
        run: uv run python -m ruff format --check

  build-and-smoke:
    name: build wheel + smoke
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Build
        run: uv build
      - name: Wheel smoke (clean venv)
        run: |
          uv venv /tmp/ctxloom-ci
          uv pip install --python /tmp/ctxloom-ci/bin/python dist/ctxloom-*.whl
          /tmp/ctxloom-ci/bin/python -c "import ctxloom; print('version', ctxloom.__version__)"
          /tmp/ctxloom-ci/bin/ctxloom --help >/dev/null
          /tmp/ctxloom-ci/bin/ctxloom graph examples.knowledge.agents >/dev/null 2>&1 || true
          if unzip -l dist/ctxloom-*.whl | grep -qE "examples/|tests/"; then echo "examples/tests leaked into wheel"; exit 1; fi