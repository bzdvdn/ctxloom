<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevOps AI (ctxloom)</title>
<style>
  :root { --bg:#10151a; --panel:#182129; --line:#26313c; --fg:#e6edf3; --muted:#8b98a5; --acc:#ff9d5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { color:var(--acc); }
  main { max-width:800px; margin:0 auto; padding:16px; }
  #messages { display:flex; flex-direction:column; gap:10px; min-height:50vh; }
  .msg { max-width:82%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1f6feb22; border:1px solid #1f6feb66; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .status { color:var(--muted); font-style:italic; }
  .waiting { color:#ffd479; }
  .chip { display:inline-block; padding:5px 11px; margin:4px 6px 0 0; border-radius:16px;
          border:1px solid var(--line); background:var(--panel); color:var(--muted);
          cursor:pointer; font-size:12.5px; }
  .chip:hover { color:var(--acc); border-color:var(--acc); }
  .controls { margin-top:16px; display:flex; gap:10px; }
  #input { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  button { padding:10px 18px; border-radius:10px; border:1px solid var(--acc); background:transparent; color:var(--acc); cursor:pointer; }
  button:hover { background:#ff9d5c22; }
</style>
</head>
<body>
<header><b>DevOps AI</b><span class="muted" id="sid"></span><a href="/traces" style="margin-left:auto; color:var(--acc); text-decoration:none; font-size:13px;">▲ Traces</a><button id="new-session">New session</button></header>
<main>
  <div id="messages"></div>
  <div>
    <span class="chip">why is a pod in my cluster down?</span>
    <span class="chip">GitLab pipeline status</span>
    <span class="chip">which MRs are open for payments?</span>
    <span class="chip">what does the playbook say about deploy?</span>
  </div>
  <div class="controls">
    <input id="input" placeholder="Ask about k8s, GitLab, or Ansible…" autofocus />
    <button id="send">Send</button>
  </div>
</main>
<script>
let sid = localStorage["devops-session"] || (localStorage["devops-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
function renderSid() { document.getElementById("sid").textContent = "session: " + sid; }
renderSid();

function add(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  el.scrollIntoView();
}

async function send(text) {
  add("user", text);
  const resp = await fetch("/api/chat/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text, session_id: sid}),
  });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let statusEl = null;
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const frame = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
      let event = "message"; let data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data = line.slice(5).trim();
      }
      if (!data) continue;
      const payload = JSON.parse(data);
      if (event === "status") {
        if (!statusEl) { statusEl = addTo("status", ""); }
        statusEl.textContent = "… " + payload.message;
      } else if (event === "message") {
        if (statusEl) { statusEl.remove(); statusEl = null; }
        add("assistant", payload.reply);
        if (payload.waiting) {
          const w = addTo("status", "… waiting for your answer");
          w.classList.add("waiting");
        }
      }
    }
  }
}

function addTo(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  return el;
}

async function loadHistory() {
  const r = await fetch("/api/runs/" + sid);
  const state = await r.json();
  for (const m of state.messages || []) add(m.role === "user" ? "user" : "assistant", m.text);
}

function submit(text) {
  if (!text) return;
  document.getElementById("input").value = "";
  send(text);
}

document.getElementById("send").addEventListener("click", () => submit(document.getElementById("input").value.trim()));
document.getElementById("input").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(document.getElementById("input").value.trim()); });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => submit(c.textContent)));
document.getElementById("new-session").addEventListener("click", async () => {
  await fetch("/api/runs/" + sid, { method: "DELETE" });
  sid = (localStorage["devops-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
  renderSid();
  document.getElementById("messages").innerHTML = "";
});
loadHistory();
</script>
</body>
</html>
