<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>fork-lab · ctxloom</title>
<style>
  :root{--bg:#f7f7f9;--panel:#fff;--border:#e6e6ee;--text:#17171f;--muted:#6f6f7e;--accent:#4f46e5;
    --accent-soft:#eef0ff;--ok:#15803d;--ok-soft:#e9f7ef;--mono:ui-monospace,Menlo,Consolas,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:16px 28px;}
  header b{font-size:16px;} header .sub{color:var(--muted);font-family:var(--mono);font-size:12px;}
  main{max-width:820px;margin:0 auto;padding:26px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px;}
  textarea,input[type=text]{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:13px var(--mono);color:var(--text);background:var(--panel);}
  textarea{min-height:84px;resize:vertical;}
  .row{display:flex;gap:12px;margin-top:12px;align-items:center;flex-wrap:wrap;}
  #run{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;}
  #run:hover{filter:brightness(1.07);}
  #run:disabled{opacity:.55;cursor:not-allowed;}
  #log{font-family:var(--mono);font-size:12.5px;color:var(--muted);}
  #log .line{margin:3px 0;}
  #answer{white-space:pre-wrap;line-height:1.6;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:2px 9px;font-family:var(--mono);font-size:11.5px;}
  .muted{color:var(--muted);font-size:12.5px;}
  #mermaid{margin-top:10px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:12px;}
  #src{background:#fafafc;border:1px solid #ececf2;border-radius:8px;padding:10px;font:11.5px var(--mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin-top:10px;display:none;}
  #copy{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 11px;cursor:pointer;}
  [hidden]{display:none;}
</style>
</head>
<body>
<header><b>fork-lab <span style="color:var(--accent)">· ctxloom</span></b>
  <span class="sub">branch &amp; merge demo (§39-§40)</span></header>
<main>
  <section class="card">
    <label for="q">Research question</label>
    <textarea id="q" placeholder="Which design recovers the most thermal energy?"></textarea>
    <div class="row">
      <input type="text" id="topic" value="thermal energy recovery in HVAC design"
             style="flex:1;min-width:240px" aria-label="topic"/>
      <button id="run">Run forked research</button>
    </div>
  </section>
  <section class="card" id="progress-card" hidden>
    <div id="log"></div>
    <div id="answer" class="muted" style="margin-top:10px"></div>
    <div class="chips" id="chips"></div>
  </section>
  <section class="card" id="diagram-card" hidden>
    <div class="row" style="margin-top:0">
      <b>Merged provenance graph</b><span class="muted">(mermaid)</span>
      <span style="flex:1"></span><button id="copy">copy</button>
    </div>
    <div id="mermaid"></div>
    <pre id="src"></pre>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function setupResult(){
  const btn=$('copy');
  btn.addEventListener('click',()=>{
    const text=$('src').textContent||$('mermaid').textContent;
    if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{btn.textContent='copied';setTimeout(()=>btn.textContent='copy',900);},{});
    } else {$('src').style.display='block';}
  });
}
function renderMermaid(src,el){
  if(!src){el.style.display='none';return;}
  el.textContent=src;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
  s.onload=()=>{window.mermaid.initialize({startOnLoad:false,theme:'default'});window.mermaid.run({nodes:[el]});};
  s.onerror=()=>{el.innerHTML='<div class="muted">Mermaid JS offline — source below.</div>';$('src').style.display='block';};
  document.head.appendChild(s);
}
async function ask(){
  const q=$('q').value.trim();
  if(!q)return;
  $('run').disabled=true;
  $('progress-card').hidden=false;
  $('diagram-card').hidden=true;
  $('log').innerHTML='';$('answer').textContent='';$('chips').innerHTML='';
  const res=await fetch('/api/ask/stream',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:q,topic:$('topic').value.trim()||null})
  });
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  function handleBlock(block){
    const lines=block.split('\n').filter(l=>l.length);
    let ev='message',data='';
    for(const line of lines){
      if(line.startsWith('event:'))ev=line.slice(6).trim();
      else if(line.startsWith('data:'))data+=line.slice(5).trim();
    }
    let payload=null;
    try{payload=JSON.parse(data);}catch(_){}
    if(ev==='status'&&payload){
      const l=document.createElement('div');l.className='line';l.textContent='▸ '+payload.message;$('log').appendChild(l);
    }else if(ev==='result'&&payload){applyResult(payload);}
    else if(ev==='message'&&payload){$('answer').textContent=payload.reply||'(no reply)';}
  }
  while(true){
    const {value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n\n'))!==-1){
      handleBlock(buf.slice(0,idx));
      buf=buf.slice(idx+2);
    }
  }
  if(buf.trim())handleBlock(buf);
  $('run').disabled=false;
}
function applyResult(data){
  $('answer').textContent=data.answer;
  const chips=(data.sources||[]).map(s=>'<span class="chip">'+escapeHtml(s)+'</span>').join('');
  $('chips').innerHTML=chips
    +'<span style="flex:1"></span><span class="muted">v'+data.version+' · '+escapeHtml(JSON.stringify(data.splits))+'</span>';
  $('src').textContent=data.mermaid||'';
  renderMermaid(data.mermaid,$('mermaid'));
  $('diagram-card').hidden=false;
}
setupResult();
$('run').addEventListener('click',ask);
</script>
</body>
</html>
