<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research AI (ctxloom)</title>
<style>
  :root { --bg:#10151a; --panel:#182129; --line:#26313c; --fg:#e6edf3; --muted:#8b98a5; --acc:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { color:var(--acc); }
  main { max-width:780px; margin:0 auto; padding:16px; }
  #messages { display:flex; flex-direction:column; gap:10px; min-height:50vh; }
  .msg { max-width:82%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1f6feb22; border:1px solid #1f6feb66; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .status { color:var(--muted); font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chip { padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel);
          color:var(--muted); cursor:pointer; font-size:12.5px; }
  .chip:hover { color:var(--acc); border-color:var(--acc); }
  .controls { margin-top:16px; display:flex; gap:10px; }
  #input { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  button { padding:10px 18px; border-radius:10px; border:1px solid var(--acc); background:transparent; color:var(--acc); cursor:pointer; }
  button:hover { background:#7aa2ff22; }
</style>
</head>
<body>
<header><b>Research AI</b><span class="muted" id="sid"></span><button id="new-session" style="margin-left:auto">New session</button></header>
<main>
  <div id="messages"></div>
  <div class="chips" id="chips">
    <span class="chip">what is deep learning?</span>
    <span class="chip">how does a GPU help inference?</span>
    <span class="chip">what is a tensor?</span>
  </div>
  <div class="controls">
    <input id="input" placeholder="Ask over the seeded web pages…" autofocus />
    <button id="send">Send</button>
  </div>
</main>
<script>
let sid = localStorage["research-session"] || (localStorage["research-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
function renderSid() { document.getElementById("sid").textContent = "session: " + sid; }
renderSid();

function add(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  el.scrollIntoView();
}

async function send(text) {
  add("user", text);
  const resp = await fetch("/api/chat/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text, session_id: sid}),
  });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let statusEl = null;
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const frame = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
      let event = null; let data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data = line.slice(5).trim();
      }
      if (!data) continue;
      const payload = JSON.parse(data);
      if (event === "status") {
        if (!statusEl) { statusEl = addTo("status", ""); }
        statusEl.textContent = "… " + payload.message;
      } else if (event === "message") {
        if (statusEl) { statusEl.remove(); statusEl = null; }
        let out = payload.reply;
        if ((payload.sources || []).length) {
          out += "\n\nSources:\n" + payload.sources.map((s) => "• " + s).join("\n");
        }
        add("assistant", out);
      }
    }
  }
}

function addTo(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  return el;
}

function submit(text) {
  if (!text) return;
  document.getElementById("input").value = "";
  send(text);
}

document.getElementById("send").addEventListener("click", () => submit(document.getElementById("input").value.trim()));
document.getElementById("input").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(document.getElementById("input").value.trim()); });
document.getElementById("chips").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) submit(e.target.textContent);
});
document.getElementById("new-session").addEventListener("click", async () => {
  await fetch("/api/runs/" + sid, { method: "DELETE" });
  sid = (localStorage["research-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
  renderSid();
  document.getElementById("messages").innerHTML = "";
});
</script>
</body>
</html>
